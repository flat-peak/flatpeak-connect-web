name: Deploy Zero to Fly

# Same as the Anode deploy on main: every push to releases/zero, including a merged PR,
# deploys Zero staging (connect-web-stg-fp) using fly-staging.toml from this branch.
on:
  push:
    branches:
      - releases/zero

concurrency:
  group: deploy-zero-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --config fly-staging.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
